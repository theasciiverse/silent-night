[package]
name = "silent-night"
version = "1.0.0"
edition = "2021"
description = "A snowy forest at night in the terminal: wind, gusts, drifting snow, a faint aurora and the forest's sound"
license = "MIT"

[dependencies]
crossterm = "0.29"
fastrand = "2"
log = "0.4"
env_logger = "0.11"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
cpal = "0.18"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
